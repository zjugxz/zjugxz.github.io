<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Xiuzhen Guo's homepage</title>
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=https://zjugxz.github.io/xiuzhen-guo-homepage/">
    <link rel="canonical" href="https://zjugxz.github.io/xiuzhen-guo-homepage/">
    <script>
      const destination = new URL("https://zjugxz.github.io/xiuzhen-guo-homepage/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Homepage moved</h1>
      <p>
        Redirecting to the new homepage.
        <a href="https://zjugxz.github.io/xiuzhen-guo-homepage/">Continue to Xiuzhen Guo's homepage</a>.
      </p>
    </main>
  </body>
</html>
