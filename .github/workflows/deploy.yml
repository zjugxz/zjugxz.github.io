name: Deploy site

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy.yml"
      - "redirect-site/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify redirect files
        run: |
          test -f redirect-site/index.html
          test -f redirect-site/404.html
          grep -Fq "https://zjugxz.github.io/xiuzhen-guo-homepage/" redirect-site/index.html
          grep -Fq "https://zjugxz.github.io/xiuzhen-guo-homepage/" redirect-site/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: redirect-site
          clean: true
