name: Verify deployed redirect

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify root redirect and destination
        shell: bash
        run: |
          target="https://zjugxz.github.io/xiuzhen-guo-homepage/"

          for attempt in {1..20}; do
            if html="$(curl --fail --silent --show-error https://zjugxz.github.io/)" && grep -Fq "$target" <<<"$html"; then
              curl --fail --silent --show-error --output /dev/null "$target"
              exit 0
            fi

            echo "Redirect has not reached the Pages edge yet (attempt $attempt/20)."
            sleep 15
          done

          echo "The deployed root page does not reference $target." >&2
          exit 1
